    <title>Abdullah - Projects</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        padding: 50px;
        font-family: Arial, Helvetica, sans-serif;
        background: #f8fafc;
      }

      /* Grid */
      .projects-grid {
        width: 100%;
        max-width: 1200px;
        margin: auto;

        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }

      /* Card */
      .project-card {
        overflow: hidden;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 18px;

        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);

        transition: 0.3s ease;
      }

      .project-card:hover {
        transform: translateY(-6px);
        box-shadow: 0 18px 40px rgba(15, 23, 42, 0.14);
      }

      /* Image */
      .project-image {
        width: 100%;
        height: 220px;
        overflow: hidden;
      }

      .project-image img {
        width: 100%;
        height: 100%;
        display: block;

        object-fit: cover;

        transition: transform 0.4s ease;
      }

      .project-card:hover .project-image img {
        transform: scale(1.05);
      }

      /* Card Bottom */
      .project-footer {
        padding: 18px;
      }

      /* View Button */
      .view-button {
        width: 100%;

        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;

        padding: 12px 18px;

        border-radius: 10px;
        background: #1b4dff;
        color: #ffffff;

        text-decoration: none;
        font-size: 14px;
        font-weight: 700;

        transition: 0.3s ease;
      }

      .view-button:hover {
        background: #0f3edb;
      }

      /* Tablet */
      @media (max-width: 900px) {
        .projects-grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      /* Mobile */
      @media (max-width: 600px) {
        body {
          padding: 20px;
        }

        .projects-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
